name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build archive (no codesign)
        run: flutter build ipa --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa_payload/Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app \
                build/ipa_payload/Payload/
          cd build/ipa_payload
          zip -qry ../door_lock_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: door-lock-ipa
          path: build/door_lock_unsigned.ipa
